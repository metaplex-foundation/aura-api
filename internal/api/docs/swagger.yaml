basePath: /
consumes:
- application/json
definitions:
  api.CreateAPIKeyRequestParams:
    properties:
      name:
        type: string
      networks:
        items:
          enum:
          - Aura
          - ' Solana'
          type: string
        type: array
    type: object
  api.PaymentStatusHistoryElement:
    properties:
      created_at:
        type: string
      memo:
        type: string
      mplx_amount:
        type: integer
      paid_at:
        type: string
      signature:
        type: string
      status:
        type: string
    type: object
  api.PaymentStatusHistoryResponse:
    properties:
      history:
        items:
          $ref: '#/definitions/api.PaymentStatusHistoryElement'
        type: array
      total_count:
        type: integer
    type: object
  api.PaymentStatusResponse:
    properties:
      is_paid:
        type: boolean
    type: object
  api.Pricing:
    properties:
      eclipse_das:
        $ref: '#/definitions/api.UIPricing'
      eclipse_get_program_accounts:
        $ref: '#/definitions/api.UIPricing'
      eclipse_rpc:
        $ref: '#/definitions/api.UIPricing'
      eclipse_swqos:
        $ref: '#/definitions/api.UIPricing'
      eclipse_websocket:
        $ref: '#/definitions/api.UIPricing'
      monthly_price_mplx:
        type: integer
      solana_das:
        $ref: '#/definitions/api.UIPricing'
      solana_get_program_accounts:
        $ref: '#/definitions/api.UIPricing'
      solana_rpc:
        $ref: '#/definitions/api.UIPricing'
      solana_swqos:
        $ref: '#/definitions/api.UIPricing'
      solana_websocket:
        $ref: '#/definitions/api.UIPricing'
    type: object
  api.SubscriptionWithPricing:
    properties:
      api_tokens_limit:
        type: integer
      id:
        type: integer
      name:
        type: string
      pricing:
        $ref: '#/definitions/api.Pricing'
      priority:
        type: integer
      priority_support:
        type: boolean
    type: object
  api.UIPricing:
    properties:
      price_mplx:
        type: integer
      requests_per_second:
        type: integer
    type: object
  api.UpdateAPIKeyRequestParams:
    properties:
      name:
        type: string
        x-nullable: true
      networks:
        items:
          enum:
          - Aura
          - ' Solana'
          type: string
        type: array
    type: object
  api.UpdateSubscriptionParams:
    properties:
      subscription_id:
        type: integer
    type: object
  api.User:
    properties:
      created_at:
        type: string
      dynamic_id:
        type: string
      last_updated_plan_at:
        type: string
      mplx_balance:
        type: integer
      next_subscription:
        $ref: '#/definitions/api.SubscriptionWithPricing'
      subscription:
        $ref: '#/definitions/api.SubscriptionWithPricing'
      subscription_ends_on:
        type: string
    type: object
  clickhouse.CreditsUsageHistory:
    properties:
      networks:
        additionalProperties:
          type: integer
        type: object
      timestamp:
        type: string
    type: object
  clickhouse.RequestsVolumeHistory:
    properties:
      network:
        type: string
      rpc_method:
        type: string
      timestamp:
        type: string
      token:
        type: string
      total_errors:
        type: integer
      total_requests:
        type: integer
    type: object
  clickhouse.ResponseTimeHistory:
    properties:
      avg_response_time_ms:
        type: integer
      network:
        type: string
      p95_response_time_ms:
        type: integer
      rpc_method:
        type: string
      timestamp:
        type: string
      token:
        type: string
    type: object
  postgres.APIKeyWithSupportedNetworks:
    properties:
      created_at:
        type: string
      deleted_at:
        type: string
      last_used:
        type: string
      name:
        type: string
      supported_networks:
        items:
          type: string
        type: array
      token:
        type: string
      total_requests:
        type: integer
    type: object
info:
  contact: {}
  description: Swagger API server for Aura API.
  termsOfService: http://swagger.io/terms/
  title: Swagger Aura
  version: 0.0.3
paths:
  /keys:
    get:
      consumes:
      - application/json
      description: Get api keys for user
      parameters:
      - description: Define if we need to show deleted keys. If the parameter is not
          present - show only living keys. If show_deleted == true only deleted keys
          will be returned. If show_deleted == false all keys (living and deleted)
          will be returned
        in: query
        name: show_deleted
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/postgres.APIKeyWithSupportedNetworks'
            type: array
        "400":
          description: Bad Request
          schema: {}
        "401":
          description: Unauthorized
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - ApiKeyAuth: []
      summary: Get api keys for user
      tags:
      - api key
    post:
      consumes:
      - application/json
      description: Create api key
      parameters:
      - description: API key creation request
        in: body
        name: request_body
        required: true
        schema:
          $ref: '#/definitions/api.CreateAPIKeyRequestParams'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/postgres.APIKeyWithSupportedNetworks'
        "400":
          description: Bad Request
          schema: {}
        "401":
          description: Unauthorized
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - ApiKeyAuth: []
      summary: Create api key
      tags:
      - api key
  /keys/{token}:
    delete:
      consumes:
      - application/json
      description: Delete api key
      parameters:
      - description: Token parameter
        example: 98379b6b-dc6a-4d8e-8271-12eed4822afc
        format: uuid
        in: path
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Api key was deleted successfully. Return empty string
          schema:
            type: string
        "400":
          description: Bad Request
          schema: {}
        "401":
          description: Unauthorized
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - ApiKeyAuth: []
      summary: Delete api key
      tags:
      - api key
    get:
      consumes:
      - application/json
      description: Get api key by token
      parameters:
      - description: Token parameter
        example: 98379b6b-dc6a-4d8e-8271-12eed4822afc
        format: uuid
        in: path
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/postgres.APIKeyWithSupportedNetworks'
        "400":
          description: Bad Request
          schema: {}
        "401":
          description: Unauthorized
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - ApiKeyAuth: []
      summary: Get api key by token
      tags:
      - api key
    patch:
      consumes:
      - application/json
      description: Update api key
      parameters:
      - description: Token parameter
        example: 98379b6b-dc6a-4d8e-8271-12eed4822afc
        format: uuid
        in: path
        name: token
        required: true
        type: string
      - description: API key update request
        in: body
        name: request_body
        required: true
        schema:
          $ref: '#/definitions/api.UpdateAPIKeyRequestParams'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/postgres.APIKeyWithSupportedNetworks'
        "400":
          description: Bad Request
          schema: {}
        "401":
          description: Unauthorized
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - ApiKeyAuth: []
      summary: Update api key
      tags:
      - api key
  /networks:
    get:
      description: Return list of supported networks
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: string
            type: array
        "400":
          description: Bad Request
          schema: {}
        "401":
          description: Unauthorized
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      summary: Get list of supported networks
      tags:
      - networks
  /payments/history:
    get:
      description: Get payment history
      parameters:
      - description: Payments per page. Default 10
        in: query
        name: limit
        type: integer
      - description: Page number. Default 1
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Payment history
          schema:
            $ref: '#/definitions/api.PaymentStatusHistoryResponse'
        "400":
          description: Bad Request
          schema: {}
        "401":
          description: Unauthorized
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - ApiKeyAuth: []
      summary: Get payment history
      tags:
      - payment
  /payments/link:
    get:
      description: Get payment link
      parameters:
      - description: The value must be a non-negative integer or decimal number of
          user units. For SOL, that's SOL and not lamports.
        in: query
        name: amount
        required: true
        type: string
      - description: Name of subscription plan
        in: query
        name: payment_type
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Payment link
          schema:
            items:
              type: string
            type: array
        "400":
          description: Bad Request
          schema: {}
        "401":
          description: Unauthorized
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - ApiKeyAuth: []
      summary: Get payment link
      tags:
      - payment
  /payments/status:
    get:
      description: Get payment status
      parameters:
      - description: Memo address
        in: query
        name: memo
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Payment status
          schema:
            $ref: '#/definitions/api.PaymentStatusResponse'
        "400":
          description: Bad Request
          schema: {}
        "401":
          description: Unauthorized
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - ApiKeyAuth: []
      summary: Get payment status
      tags:
      - payment
  /plan/downgrade:
    patch:
      description: Downgrade subscription plan
      parameters:
      - description: Subscription ID to which the current plan will be changed at
          the end of the subscription period
        in: body
        name: request_body
        required: true
        schema:
          $ref: '#/definitions/api.UpdateSubscriptionParams'
      produces:
      - application/json
      responses:
        "200":
          description: Subscription was changed successfully. Return empty string
          schema:
            type: string
        "400":
          description: Cannot switch to the selected subscription.
          schema: {}
        "401":
          description: Unauthorized
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - ApiKeyAuth: []
      summary: Downgrade subscription plan
      tags:
      - users
  /plan/undo_downgrading:
    patch:
      description: Undo downgrading of a subscription plan
      produces:
      - application/json
      responses:
        "200":
          description: Subscription cancellation has been undone successfully. Return
            empty string
          schema:
            type: string
        "401":
          description: Unauthorized
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - ApiKeyAuth: []
      summary: Undo downgrading of a subscription plan
      tags:
      - users
  /plan/upgrade:
    patch:
      description: Get subscriptions plan info
      parameters:
      - description: Subscription ID to change plan
        in: body
        name: request_body
        required: true
        schema:
          $ref: '#/definitions/api.UpdateSubscriptionParams'
      produces:
      - application/json
      responses:
        "200":
          description: Subscription was changed successfully. Return empty string
          schema:
            type: string
        "400":
          description: Cannot switch to the selected subscription.
          schema: {}
        "401":
          description: Unauthorized
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - ApiKeyAuth: []
      summary: Get subscriptions plan info
      tags:
      - users
  /plans:
    get:
      description: Get subscriptions plan info
      produces:
      - application/json
      responses:
        "200":
          description: If there is no monthly_price_mplx in response - it is Pay As
            You Go plan and we need to use price_mplx inside each pricing. If monthly_price_mplx
            present - we need to use it
          schema:
            items:
              $ref: '#/definitions/api.SubscriptionWithPricing'
            type: array
        "400":
          description: Bad Request
          schema: {}
        "401":
          description: Unauthorized
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      summary: Get subscriptions plan info
      tags:
      - networks
  /stats/credits/usage:
    get:
      description: Get user credits usage
      parameters:
      - description: Request granularity (1 candle size). Can be either 1d (1 day)
          or 1h (1 hour)
        in: query
        name: granularity
        required: true
        type: string
      - description: 'Request timeframe. Can be one of the following: [1h, 4h, 12h,
          1d, 7d, 14d, 30d]'
        in: query
        name: timeframe
        required: true
        type: string
      - description: User api token
        example: 98379b6b-dc6a-4d8e-8271-12eed4822afc
        format: uuid
        in: query
        name: token
        type: string
      - description: Network where requests were executed
        in: query
        name: network
        type: string
      - description: RPC method. If indicated, require paas network parameter too
        in: query
        name: method
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/clickhouse.CreditsUsageHistory'
            type: array
        "400":
          description: Bad Request
          schema: {}
        "401":
          description: Unauthorized
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - ApiKeyAuth: []
      summary: Get user credits usage
      tags:
      - stats
  /stats/request/volume:
    get:
      description: Get user requests volume
      parameters:
      - description: Request granularity (1 candle size). Can be either 1d (1 day)
          or 1h (1 hour)
        in: query
        name: granularity
        required: true
        type: string
      - description: 'Request timeframe. Can be one of the following: [1h, 4h, 12h,
          1d, 7d, 14d, 30d]'
        in: query
        name: timeframe
        required: true
        type: string
      - description: User api token
        example: 98379b6b-dc6a-4d8e-8271-12eed4822afc
        format: uuid
        in: query
        name: token
        type: string
      - description: Network where requests were executed
        in: query
        name: network
        type: string
      - description: RPC method. If indicated, require paas network parameter too
        in: query
        name: method
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/clickhouse.RequestsVolumeHistory'
            type: array
        "400":
          description: Bad Request
          schema: {}
        "401":
          description: Unauthorized
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - ApiKeyAuth: []
      summary: Get user requests volume
      tags:
      - stats
  /stats/response/time:
    get:
      description: Get response time history (avg && p95) for user requests
      parameters:
      - description: Request granularity (1 candle size). Can be either 1d (1 day)
          or 1h (1 hour)
        in: query
        name: granularity
        required: true
        type: string
      - description: 'Request timeframe. Can be one of the following: [1h, 4h, 12h,
          1d, 7d, 14d, 30d]'
        in: query
        name: timeframe
        required: true
        type: string
      - description: User api token
        example: 98379b6b-dc6a-4d8e-8271-12eed4822afc
        format: uuid
        in: query
        name: token
        type: string
      - description: Network where requests were executed
        in: query
        name: network
        type: string
      - description: RPC method. If indicated, require paas network parameter too
        in: query
        name: method
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/clickhouse.ResponseTimeHistory'
            type: array
        "400":
          description: Bad Request
          schema: {}
        "401":
          description: Unauthorized
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - ApiKeyAuth: []
      summary: Get response time history (avg && p95) for user requests
      tags:
      - stats
  /user:
    get:
      consumes:
      - application/json
      description: Return object with user info
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.User'
        "400":
          description: Bad Request
          schema: {}
        "401":
          description: Unauthorized
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - ApiKeyAuth: []
      summary: Get user info
      tags:
      - users
schemes:
- http
- https
securityDefinitions:
  ApiKeyAuth:
    description: Bearer JWT
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
