syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option go_package = "scanner-api-back-golang/internal/pkg/proto";

package proto;

service Aura {
  // ClickHouse
  rpc BatchInsertStats(BatchInsertStatsReq) returns (google.protobuf.Empty) {}
  rpc IncreaseUserRequests(IncreaseUserRequestsReq) returns (google.protobuf.Empty) {}
  rpc BatchInsertDetailedRequests(BatchInsertDetailedRequestsReq) returns (google.protobuf.Empty) {}
}

message Stat {
  google.protobuf.Timestamp timestamp = 1;
  string user_uid = 2;
  string request_uuid = 3;
  string endpoint = 4;
  string rpc_error_code = 5;
  string user_agent = 6;
  string rpc_method = 7;
  string rpc_request_data = 8;
  string chain = 9;
  int64 execution_time_ms = 10;
  int64 response_time_ms = 11;
  uint32 status = 12;
  uint32 attempts = 13;
  string project_uuid = 14;
  int64 response_size_bytes = 15;
  string target_type = 16;
}

message BatchInsertStatsReq {
  repeated Stat stats = 1;
}

message IncreaseUserRequestsReq {
  map<string, int64> reqs = 1;
}

message DetailedRequest {
  google.protobuf.Timestamp timestamp = 1;
  string user_uid = 2;
  string request_uuid = 3;
  string endpoint = 4;
  string rpc_error_code = 5;
  string user_agent = 6;
  string rpc_method = 7;
  string rpc_request_body = 8;
  string chain = 9;
  int64 execution_time_ms = 10;
  uint32 status = 11;
  uint32 attempts = 12;
  int64 response_size_bytes = 13;
}

message BatchInsertDetailedRequestsReq {
  repeated DetailedRequest req = 1;
}