version: "3.1"

services:
  aura-api:
    container_name: aura-api
    image: aura-go:latest
    restart: always
    tty: true
    ports:
      - "${API_PORT}:${API_PORT}"
      - "${API_SWAGGER_PORT}:${API_SWAGGER_PORT}"
    env_file:
      - .env
    entrypoint: "api"
    command:
      - -log=debug
    logging:
      options:
        max-size: "1g"
