services:
  aura-api:
    container_name: aura-api
    image: ghcr.io/adm-metaex/aura-api/aura-api:v0.0.1-bc523fb
    restart: always
    tty: true
    ports:
      - "${API_PORT}:${API_PORT}"
      - "${API_SWAGGER_PORT}:${API_SWAGGER_PORT}"
    volumes:
      - ./creds/API_CERT_FILE:/creds/API_CERT_FILE:ro
    env_file:
      - .env
    command:
      - -log=debug
    logging:
      options:
        max-size: "1g"
