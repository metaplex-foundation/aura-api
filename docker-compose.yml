version: "3.1"
services:
  aura-api:
    container_name: aura-api
    image: ghcr.io/adm-metaex/aura-api:v0.0.1-ccf7668
    restart: always
    tty: true
    ports:
      - "${API_PORT}:${API_PORT}"
      - "${API_SWAGGER_PORT}:${API_SWAGGER_PORT}"
    env_file:
      - .env
    entrypoint: "api"
    command:
      - -log=debug
    logging:
      options:
        max-size: "1g"
